name: Inspector and visual viewer

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Node runtime
        run: node -e 'if (Number(process.versions.node.split(".")[0]) < 22) throw new Error("Node 22 or newer required")'
      - name: Inspector contract and lifecycle tests
        run: npm --prefix tools/inspector test
      - name: Embedded visual viewer tests
        run: node --test src/visual_debug/viewer_filter.test.js
